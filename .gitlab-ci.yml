image: docker:latest

variables:
  TAG_NAME: $CI_COMMIT_REF_NAME
  IMAGE_NAME: $CI_REGISTRY_IMAGE:$TAG_NAME
  # Misma imagen con una etiqueta fija por commit (no se pisa en el próximo
  # build): es lo que permite volver a una versión anterior. Ver
  # docs/DEPLOY.md, sección "Volver a una versión anterior".
  IMAGE_SHA: $CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA

stages:
  - check
  - build
  - push
  - notify

# STAGE 0: Controles de calidad antes de construir la imagen. Si algo falla,
# no se construye ni se publica nada.
#   - typecheck: TypeScript (incluye `next typegen`, ver package.json)
#   - lint: ESLint
#   - test: tests unitarios (node --test)
#   - audit: dependencias de producción con vulnerabilidades altas o
#     críticas conocidas (npm audit)
# Si el runner no tiene salida a internet, definir NPM_CONFIG_REGISTRY en
# las variables de CI/CD (mismo registry interno que usa el Dockerfile).
check:
  stage: check
  image: node:24-alpine
  tags:
    - build

  cache:
    key:
      files:
        - package-lock.json
    paths:
      - .npm/

  script:
    - echo "STAGE - CHECK"
    - npm ci --cache .npm --prefer-offline --no-fund
    - npm run typecheck
    - npm run lint
    - npm test
    - npm audit --omit=dev --audit-level=high

  only:
    - main
    - dev
    - merge_requests


# STAGE 1: Docker image build
build_image:
  stage: build
  tags:
    - build

  script:
    - echo "STAGE - BUILDING"
    - echo "$IMAGE_NAME"

    - echo "Autenticando en el Docker Registry...(build)"
    - unset DOCKER_HOST
    - echo "$CI_REGISTRY_PASSWORD" | docker login --username "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"

    - echo "Verificando variables de Supabase..."
    - test -n "$NEXT_PUBLIC_SUPABASE_URL" || (echo "ERROR - Falta NEXT_PUBLIC_SUPABASE_URL" && exit 1)
    - test -n "$NEXT_PUBLIC_SUPABASE_ANON_KEY" || (echo "ERROR - Falta NEXT_PUBLIC_SUPABASE_ANON_KEY" && exit 1)
    - test -n "$SITE_URL" || (echo "ERROR - Falta SITE_URL" && exit 1)

    - echo "Construyendo la imagen Docker..."

    - |
      docker build \
        --build-arg NEXT_PUBLIC_SUPABASE_URL="$NEXT_PUBLIC_SUPABASE_URL" \
        --build-arg NEXT_PUBLIC_SUPABASE_ANON_KEY="$NEXT_PUBLIC_SUPABASE_ANON_KEY" \
        --build-arg SITE_URL="$SITE_URL" \
        -t "$IMAGE_NAME" \
        -t "$IMAGE_SHA" .

  only:
    - main
    - dev


# STAGE 2: Image publish to Docker registry
push_image:
  stage: push
  tags:
    - build

  script:
    - echo "STAGE - PUSHING"

    - echo "Autenticando en el Docker Registry..."
    - echo "$CI_REGISTRY_PASSWORD" | docker login --username "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"

    - echo "Subiendo la imagen Docker al registro..."
    - docker push "$IMAGE_NAME"
    - docker push "$IMAGE_SHA"
    - echo "Publicada también como $IMAGE_SHA (para volver a esta versión)"

  when: manual

  only:
    - main
    - dev


# STAGE 3: Execute Webhook for container update in Portainer
notify_prod:
  stage: notify
  tags:
    - build

  script:
    - echo "STAGE - NOTIFYING MAIN"

    - echo "Instalando curl..."
    - apk add --no-cache curl

    - echo "Ejecutando el Webhook para actualizar el contenedor en Portainer..."
    - curl --fail -X POST "$WEBHOOK_URL_MAIN"

  when: manual

  only:
    - main


# STAGE 3: Execute Webhook for container update in Portainer
notify_dev:
  stage: notify
  tags:
    - build

  script:
    - echo "STAGE - NOTIFYING DEV"

    - echo "Instalando curl..."
    - apk add --no-cache curl

    - echo "Ejecutando el Webhook para actualizar el contenedor en Portainer..."
    - curl --fail -X POST "$WEBHOOK_URL_DEV"

  when: manual

  only:
    - dev